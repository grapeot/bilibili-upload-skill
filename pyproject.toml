[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bilibili-upload-skill"
version = "0.1.0"
description = "Agent skill + CLI: fill the Bilibili upload form in a visible Chrome via Playwright, and stop before the human clicks submit."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bili-upload = "bilibili_upload.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
